# 基础配置（必需）。
# 优先级：环境变量 > config.<env>.yaml > config.yaml
# 敏感字段（db.dsn / redis.address / redis.password / auth.jwt_secret）
# 约定通过环境变量注入：DB_DSN / REDIS_ADDRESS / REDIS_PASSWORD / AUTH_JWT_SECRET

server:
  host: 0.0.0.0
  port: 8080
  mode: debug            # debug / release / test
  cors_origins:
    - http://localhost:3000

db:
  # dsn 不落地，由环境变量 DB_DSN 注入，例如：
  # export DB_DSN="user:pass@tcp(127.0.0.1:3306)/demo?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle: 10
  max_open: 100

redis:
  # address / password 由 REDIS_ADDRESS / REDIS_PASSWORD 注入
  db: 0

auth:
  # jwt_secret 由 AUTH_JWT_SECRET 注入

tracing:
  enabled: false
  endpoint: localhost:4318   # OTLP HTTP endpoint
  sample_rate: 1.0

lock:
  engine: dummy              # dummy（开发） / redis（生产）

# ---- 业务自定义字段 ----
app_name: carina-example
greeting: "hello from base config"
